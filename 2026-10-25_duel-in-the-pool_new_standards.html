    try {
      var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(document.getElementById('pw').value.trim()), 'PBKDF2', false, ['deriveBits']);

    } catch (e3) { err.textContent = 'That password did not work.'; btn.disabled = false; }
  });
})();
