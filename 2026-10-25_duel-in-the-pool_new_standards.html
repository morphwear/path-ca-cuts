<script>
(async function () {
  var P = JSON.parse(document.getElementById('sealed').textContent), KEY = 'pathSiteKey:' + P.salt;
  var bytes = function (s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); };
  var b64 = function (u) { var s = ''; for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); };
