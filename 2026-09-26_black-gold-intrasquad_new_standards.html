      var raw = new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: bytes(P.salt), iterations: P.iter }, base, 256));
      var page = await unseal(raw);
      try { localStorage.setItem(KEY, b64(raw)); } catch (e2) {}
      show(page);
    } catch (e3) { err.textContent = 'That password did not work.'; btn.disabled = false; }
  });
})();
